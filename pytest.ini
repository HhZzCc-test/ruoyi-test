[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short --strict-markers --alluredir=allure-results
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    smoke: smoke tests
    critical: critical tests
    auth: authentication tests
# 说明：
#   tests/             —— 针对若依服务的接口/UI 用例（需要服务与 Redis 在线）
#   tests_aitest/      —— aitest 模块自身的单测（离线可跑，见 CI）
#   tests_ai_generated/—— aitest 生成的骨架示例，默认不纳入回归
norecursedirs = tests_ai_generated .git .idea __pycache__ allure-results allure-report
